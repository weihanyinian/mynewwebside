<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>数字华容道</title>
<link rel="stylesheet" href="../_shared/base.css" />
<style>
  body { background: var(--moyu-panel); }
  .info-bar {
    display:flex;justify-content:space-between;align-items:center;
    width:100%;max-width:380px;padding:4px 0;color:var(--moyu-fg);font-weight:700;font-size:.95rem;
  }
  .grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
    width:min(340px,calc(100vw - 32px));aspect-ratio:1;margin:8px auto;
  }
  .cell{
    display:flex;align-items:center;justify-content:center;
    border-radius:12px;font-size:1.3rem;font-weight:800;cursor:pointer;
    border:1px solid var(--moyu-glass-b);background:var(--moyu-glass);color:var(--moyu-fg);
    transition:transform .12s ease,background .15s ease;
    touch-action:manipulation;
  }
  .cell:active{transform:scale(0.93);}
  .cell--empty{background:transparent;border-color:transparent;cursor:default;}
  .cell--correct{background:var(--moyu-accent);color:#fff;border-color:rgba(255,255,255,0.3);}
</style>
</head>
<body>
<div class="moyu-game-root">
  <p class="moyu-hint">点击与空格相邻的数字方块滑动，按 1~15 顺序排列即可获胜</p>
  <div class="info-bar">
    <span id="moves">步数: 0</span>
    <span id="timer">00:00</span>
    <span id="hi">最少: -</span>
  </div>
  <div class="grid" id="grid"></div>
  <button class="moyu-btn moyu-btn--primary" id="restartBtn" style="margin-top:8px">重新开始</button>
</div>
<script src="../_shared/bridge.js"></script>
<script>
(function(){
  var SIZE=4, TOTAL=SIZE*SIZE;
  var gridEl=document.getElementById('grid');
  var movesEl=document.getElementById('moves'), timerEl=document.getElementById('timer'), hiEl=document.getElementById('hi');
  var tiles, emptyIdx, moves, startTime, timerInterval, won;

  function init(){
    tiles=[];for(var i=1;i<TOTAL;i++)tiles.push(i);tiles.push(0);
    // shuffle by making random valid moves (ensures solvability)
    emptyIdx=TOTAL-1;
    for(var m=0;m<300;m++){
      var nb=neighbors(emptyIdx);
      var pick=nb[Math.floor(Math.random()*nb.length)];
      tiles[emptyIdx]=tiles[pick];tiles[pick]=0;emptyIdx=pick;
    }
    moves=0;won=false;startTime=Date.now();
    if(timerInterval)clearInterval(timerInterval);
    timerInterval=setInterval(updateTimer,500);
    var hi=MOYU.getHi();
    hiEl.textContent='最少: '+(hi>0?hi+'步':'-');
    MOYU.post({type:'playing'});
    render();
  }

  function neighbors(idx){
    var r=Math.floor(idx/SIZE),c=idx%SIZE,n=[];
    if(r>0)n.push(idx-SIZE);if(r<SIZE-1)n.push(idx+SIZE);
    if(c>0)n.push(idx-1);if(c<SIZE-1)n.push(idx+1);
    return n;
  }

  function render(){
    gridEl.innerHTML='';
    tiles.forEach(function(v,i){
      var div=document.createElement('div');
      div.className='cell'+(v===0?' cell--empty':'')+(v!==0&&v===i+1?' cell--correct':'');
      div.textContent=v||'';
      if(v!==0){
        div.addEventListener('click',function(){move(i);});
        div.addEventListener('touchend',function(e){e.preventDefault();move(i);});
      }
      gridEl.appendChild(div);
    });
    movesEl.textContent='步数: '+moves;
  }

  function move(idx){
    if(won)return;
    if(neighbors(idx).indexOf(emptyIdx)===-1)return;
    tiles[emptyIdx]=tiles[idx];tiles[idx]=0;emptyIdx=idx;
    moves++;render();checkWin();
  }

  function checkWin(){
    for(var i=0;i<TOTAL-1;i++){if(tiles[i]!==i+1)return;}
    won=true;clearInterval(timerInterval);
    MOYU.setHi(moves);
    hiEl.textContent='最少: '+MOYU.getHi()+'步';
    MOYU.stats(moves+'步完成 / 最少 '+MOYU.getHi()+'步');
    MOYU.gameover();
  }

  function updateTimer(){
    if(won)return;
    var s=Math.floor((Date.now()-startTime)/1000);
    var m=Math.floor(s/60);s=s%60;
    timerEl.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }

  document.getElementById('restartBtn').addEventListener('click',init);
  init();
})();
</script>
</body>
</html>
