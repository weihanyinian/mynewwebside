<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>贪吃蛇</title>
<link rel="stylesheet" href="../_shared/base.css" />
<style>
  body { background: var(--moyu-panel); }
  .score-bar {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 420px; padding: 4px 0; color: var(--moyu-fg); font-weight: 700; font-size: .95rem;
  }
  .game-area {
    display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 6px;
  }
</style>
</head>
<body>
<div class="moyu-game-root">
  <p class="moyu-hint">方向键 / 滑动控制方向，吃到食物得分，撞墙或撞自己结束</p>
  <div class="score-bar">
    <span id="score">得分: 0</span>
    <span id="hi">最高: 0</span>
  </div>
  <div class="game-area">
    <canvas id="c" class="moyu-canvas"></canvas>
    <div class="moyu-dpad moyu-dpad--mobile-only">
      <button class="moyu-btn" id="btnU">▲</button>
      <div class="moyu-dpad-mid">
        <button class="moyu-btn" id="btnL">◀</button>
        <button class="moyu-btn" id="btnD">▼</button>
        <button class="moyu-btn" id="btnR">▶</button>
      </div>
    </div>
    <button class="moyu-btn moyu-btn--primary" id="restartBtn">重新开始</button>
  </div>
</div>
<script src="../_shared/bridge.js"></script>
<script>
(function(){
  var COLS=20, ROWS=20, CELL=18;
  var canvas=document.getElementById('c');
  canvas.width=COLS*CELL; canvas.height=ROWS*CELL;
  var ctx=canvas.getContext('2d');
  var scoreEl=document.getElementById('score'), hiEl=document.getElementById('hi');
  var snake,dir,food,score,hi,running,timer,speed;

  function init(){
    snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir={x:1,y:0}; score=0; speed=120; running=true;
    hi=MOYU.getHi();
    placeFood(); updateUI(); draw();
    if(timer) clearInterval(timer);
    timer=setInterval(tick,speed);
    MOYU.post({type:'playing'});
  }

  function placeFood(){
    var tries=0;
    do{ food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}; tries++; }
    while(snake.some(function(s){return s.x===food.x&&s.y===food.y}) && tries<500);
  }

  function tick(){
    if(!running) return;
    var head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(function(s){return s.x===head.x&&s.y===head.y})){
      running=false; clearInterval(timer);
      MOYU.setHi(score); hi=MOYU.getHi(); updateUI();
      MOYU.stats('得分 '+score+' / 最高 '+hi);
      MOYU.gameover();
      return;
    }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){
      score+=10;
      if(speed>60){ speed-=3; clearInterval(timer); timer=setInterval(tick,speed); }
      placeFood();
    }else{ snake.pop(); }
    updateUI(); draw();
  }

  function updateUI(){
    scoreEl.textContent='得分: '+score;
    hiEl.textContent='最高: '+hi;
    MOYU.stats('得分 '+score+' / 最高 '+hi);
  }

  function draw(){
    var isDark=document.documentElement.classList.contains('moyu-dark');
    ctx.fillStyle=isDark?'rgba(15,23,42,0.92)':'rgba(240,248,255,0.92)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // grid
    ctx.strokeStyle=isDark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.05)';
    ctx.lineWidth=0.5;
    for(var i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,ROWS*CELL);ctx.stroke();}
    for(var j=0;j<=ROWS;j++){ctx.beginPath();ctx.moveTo(0,j*CELL);ctx.lineTo(COLS*CELL,j*CELL);ctx.stroke();}
    // food
    ctx.fillStyle=isDark?'#f472b6':'#e11d48';
    ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-2,0,Math.PI*2); ctx.fill();
    // snake
    snake.forEach(function(s,i){
      var alpha=1-i*0.03; if(alpha<0.4)alpha=0.4;
      if(i===0) ctx.fillStyle=isDark?'#34d399':'#16a34a';
      else ctx.fillStyle=isDark?'rgba(52,211,153,'+alpha+')':'rgba(34,197,94,'+alpha+')';
      ctx.beginPath();
      ctx.roundRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2,4);
      ctx.fill();
    });
  }

  function setDir(dx,dy){
    if(snake.length>1 && dx===-dir.x && dy===-dir.y) return;
    dir={x:dx,y:dy};
  }

  document.addEventListener('keydown',function(e){
    switch(e.key){
      case'ArrowUp':case'w':case'W': setDir(0,-1); e.preventDefault(); break;
      case'ArrowDown':case's':case'S': setDir(0,1); e.preventDefault(); break;
      case'ArrowLeft':case'a':case'A': setDir(-1,0); e.preventDefault(); break;
      case'ArrowRight':case'd':case'D': setDir(1,0); e.preventDefault(); break;
    }
  });
  document.getElementById('btnU').addEventListener('click',function(){setDir(0,-1);});
  document.getElementById('btnD').addEventListener('click',function(){setDir(0,1);});
  document.getElementById('btnL').addEventListener('click',function(){setDir(-1,0);});
  document.getElementById('btnR').addEventListener('click',function(){setDir(1,0);});
  document.getElementById('restartBtn').addEventListener('click',init);

  // touch swipe
  var tx,ty;
  canvas.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  canvas.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)>Math.abs(dy)){setDir(dx>0?1:-1,0);}else{setDir(0,dy>0?1:-1);}
  },{passive:true});

  init();
})();
</script>
</body>
</html>
