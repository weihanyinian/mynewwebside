# 模板：仅启动网易云 api-enhanced（https://github.com/NeteaseCloudMusicApiEnhanced/api-enhanced）。可复制为 deploy/docker-compose.ncm-only.yml 再改端口等（该文件名已 gitignore）
# 不复制也可直接用：docker compose -f deploy/docker-compose.ncm-only.example.yml up -d
name: ncm-dev

services:
  ncm-api:
    image: moefurina/ncm-api:latest
    container_name: ncm-api-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      ENABLE_GENERAL_UNBLOCK: "true"
      ENABLE_FLAC: "true"
      SELECT_MAX_BR: "false"
      FOLLOW_SOURCE_ORDER: "true"
      ENABLE_PROXY: "false"
      http_proxy: ""
      https_proxy: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      no_proxy: "*"
      NO_PROXY: "*"
