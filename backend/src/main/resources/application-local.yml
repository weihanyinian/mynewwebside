spring:
  datasource:
    url: jdbc:h2:file:./data/weihanyinian;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

app:
  view-counter-redis: false
  bootstrap:
    admin-password: admin123
    admin-sync-on-startup: true

# AI (loaded from .env or system env)
ai:
  companion:
    enabled: ${AI_COMPANION_ENABLED:true}
    api-key: ${AI_COMPANION_API_KEY:sk-48de614a625a4e638ba611448eac2201}
    base-url: ${AI_COMPANION_BASE_URL:https://api.deepseek.com}
    model: ${AI_COMPANION_MODEL:deepseek-chat}

# NCM API
ncm:
  base-url: ${NCM_BASE_URL:http://localhost:3000}
