server:
  port: 8080
  servlet:
    session:
      timeout: 7d
      cookie:
        name: MYWEBSIDE_SESSION
        http-only: true
        same-site: lax
  tomcat:
    threads:
      max: 50
      min-spare: 5
    max-connections: 200
    accept-count: 50
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/xml,application/xml
    min-response-size: 1024

spring:
  application:
    name: blog-backend
  datasource:
    url: jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: existing schema from ddl-auto era
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Shanghai
  data:
    redis:
      data:
  redis:
      host: ${REDIS_HOST:}  # 空字符串，不连接 Redis
      port: ${REDIS_PORT:0}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s

app:
  cors:
    allowed-origins: "http://localhost:5173"
  daily-quotes:
    - "维寒一念，步履不停。"
    - "代码与文字，都是留给自己和访客的路标。"
    - "今日宜：读一页书，写一行诗。"
  # 本地 admin 明文密码；仍可用环境变量 BOOTSTRAP_ADMIN_PASSWORD 覆盖
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:123456}
  # 本地：已存在 admin 时启动也会把密码同步为上一项（能登录后建议改回 false）
  bootstrap-admin-sync-on-startup: true
  jwt:
    # 本地默认密钥（≥32 字符）；生产务必用环境变量 APP_JWT_SECRET 覆盖
    secret: ${APP_JWT_SECRET:local-dev-jwt-secret-change-me-32chars!!}
    expire-minutes: ${JWT_EXPIRE_MINUTES:10080}
  view-counter:
    redis: ${VIEW_COUNTER_REDIS:false}
    flush-ms: 60000

ai:
  companion:
    # 本地默认开启；生产可设环境变量 AI_COMPANION_ENABLED=false 关闭
    enabled: ${AI_COMPANION_ENABLED:true}
    # DeepSeek API BaseURL（OpenAI 兼容）
    base-url: ${AI_COMPANION_BASE_URL:https://api.deepseek.com/v1}
    # DeepSeek 模型
    model: ${AI_COMPANION_MODEL:deepseek-chat}
    # DeepSeek Key：同时支持 apiKey（推荐）与 api-key；环境变量 AI_COMPANION_API_KEY 仍可覆盖。
    # 若 yml 里有值仍报「api-key 缺失」，请检查环境变量 AI_COMPANION_API_KEY 是否被设成「空字符串」。
    apiKey: ${AI_COMPANION_API_KEY:sk-62bbad70ae564b7a95945d56cad71969}
    max-input-chars: ${AI_COMPANION_MAX_INPUT_CHARS:300}
    rate-limit-per-minute: ${AI_COMPANION_RATE_LIMIT_PER_MINUTE:20}
    timeout-ms: ${AI_COMPANION_TIMEOUT_MS:12000}
    temperature: ${AI_COMPANION_TEMPERATURE:0.65}

oj:
  judge0:
    base-url: https://ce.judge0.com
    poll-interval-ms: 400
    poll-max-rounds: 80
    rapid-api-key: ""
    rapid-api-host: ""

netease:
  proxy:
    base-url: http://127.0.0.1:3000
    # 本地未起 3000 时自动回退公网代理（公开歌单/播放链接）；登录网易云仍建议起 moefurina/ncm-api 或 npm 增强版
    local-fallback-enabled: true
    fallback-base-url: https://netease-cloud-music-api-five-roan-58.vercel.app
    default-playlist-id: ${NETEASE_DEFAULT_PLAYLIST_ID:489057279}
    default-br: ${NETEASE_DEFAULT_BR:320000}
    retry-count: ${NETEASE_PROXY_RETRY_COUNT:1}
  music:
    open:
      enabled: false
      base-url: ${NETEASE_MUSIC_OPEN_BASE_URL:}
      app-id: ${NETEASE_MUSIC_APP_ID:}
      app-secret: ${NETEASE_MUSIC_APP_SECRET:}
      private-key-base64: ${NETEASE_MUSIC_PRIVATE_KEY:}
      public-key-base64: ${NETEASE_MUSIC_PUBLIC_KEY:}
      connect-timeout-ms: 5000
      read-timeout-ms: 20000
      paths:
        search: /api/v1/music/search
        song-url: /api/v1/song/url
        lyric: /api/v1/song/lyric
        recommend-playlists: /api/v1/playlist/recommend
      headers:
        app-id: X-App-Id
        timestamp: X-Timestamp
        nonce: X-Nonce
        signature: X-Signature
      sign:
        template: "{appId}\n{timestamp}\n{nonce}\n{bodySha256Hex}"
        encrypt-body: false
        aes-key-length: 16

ncm:
  base-url: http://127.0.0.1:3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
