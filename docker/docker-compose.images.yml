# 使用已构建/已 docker load 的镜像（无构建上下文）
# 打包镜像（Windows，在项目根目录）：docker\package-for-server.ps1 -Tag v1
# 启动：docker compose -f docker/docker-compose.images.yml --env-file docker/.env up -d

name: mywebsite

services:
  mysql:
    image: mysql:8.0
    container_name: mywebsite-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog}
      MYSQL_USER: ${MYSQL_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks: [app]

  redis:
    image: redis:7-alpine
    container_name: mywebsite-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app]

  ncm-api:
    image: binaryify/netease_cloud_music_api:latest
    container_name: mywebsite-ncm-api
    restart: unless-stopped
    environment:
      PORT: 3000
    networks: [app]

  backend:
    image: mywebsite-backend:${IMAGE_TAG:-latest}
    container_name: mywebsite-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog}
      MYSQL_USER: ${MYSQL_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      VIEW_COUNTER_REDIS: ${VIEW_COUNTER_REDIS:-false}
      NETEASE_PROXY_BASE_URL: http://ncm-api:3000
      NCM_BASE_URL: http://ncm-api:3000
      AI_COMPANION_ENABLED: ${AI_COMPANION_ENABLED:-false}
      AI_COMPANION_API_KEY: ${AI_COMPANION_API_KEY:-}
    networks: [app]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    image: mywebsite-frontend:${IMAGE_TAG:-latest}
    container_name: mywebsite-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    networks: [app]

networks:
  app:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
