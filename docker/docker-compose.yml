# 服务器部署编排（已 gitignore，不会提交）
# 仓库根：docker compose -f docker/docker-compose.yml --env-file docker/.env up -d --build

name: mywebsite

services:
  mysql:
    image: mysql:8.0
    container_name: mywebsite-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in docker/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog}
      MYSQL_USER: ${MYSQL_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in docker/.env}
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks: [app]

  redis:
    image: redis:7-alpine
    container_name: mywebsite-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app]

  ncm-api:
    image: moefurina/ncm-api:latest
    container_name: mywebsite-ncm-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      http_proxy: ""
      https_proxy: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      no_proxy: "*"
      NO_PROXY: "*"
    networks: [app]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  qq-music-api:
    build:
      context: ./qq-music-api
      dockerfile: Dockerfile
    image: mywebsite-qq-music-api:local
    container_name: mywebsite-qq-music-api
    restart: unless-stopped
    networks: [app]

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    image: mywebsite-backend:local
    container_name: mywebsite-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ncm-api:
        condition: service_started
      qq-music-api:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog}
      MYSQL_USER: ${MYSQL_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in docker/.env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?set APP_CORS_ALLOWED_ORIGINS in docker/.env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      VIEW_COUNTER_REDIS: ${VIEW_COUNTER_REDIS:-false}
      NETEASE_PROXY_BASE_URL: ${NETEASE_PROXY_BASE_URL:-http://ncm-api:3000}
      NCM_BASE_URL: ${NCM_BASE_URL:-http://ncm-api:3000}
      QQ_MUSIC_PROXY_BASE_URL: ${QQ_MUSIC_PROXY_BASE_URL:-http://qq-music-api:3300}
      AI_COMPANION_ENABLED: ${AI_COMPANION_ENABLED:-false}
      AI_COMPANION_API_KEY: ${AI_COMPANION_API_KEY:-}
    networks: [app]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    image: mywebsite-frontend:local
    container_name: mywebsite-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    networks: [app]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  app:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
